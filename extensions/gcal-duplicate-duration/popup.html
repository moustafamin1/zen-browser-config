<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a73e8;
      display: flex;
      align-items: center;
    }
    
    .option-group {
      margin-bottom: 20px;
    }
    
    .option-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #1a73e8;
    }
    
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    .shortcut-input {
      width: 100px;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
    }
    
    .shortcut-input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    
    .description {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }
    
    .save-button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 16px;
    }
    
    .save-button:hover {
      background-color: #1557b0;
    }
    
    .save-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }
    
    .success {
      color: #0f9d58;
    }
    
    .error {
      color: #d93025;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="Extension Icon" style="width: 24px; height: 24px; margin-right: 8px;">
    Google Calendar Duplicate
  </div>
  
  <div class="option-group">
    <div class="option-label">
      <span>Enable duplicate shortcut</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableShortcut" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="description">
      When enabled, you can use a keyboard shortcut to quickly duplicate events
    </div>
  </div>
  
  <div class="option-group">
    <div class="option-label">
      <span>Shortcut key</span>
      <input type="text" id="shortcutKey" class="shortcut-input" value="Shift+Click" readonly>
    </div>
    <div class="description">
      Click to change the shortcut key (currently: Shift + Click)
    </div>
  </div>
  
  <div class="option-group">
    <div class="option-label">
      <span>Show event duration</span>
      <label class="toggle-switch">
        <input type="checkbox" id="showDuration" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="description">
      Display the total duration of events on event cards
    </div>
  </div>
  
  <button id="saveButton" class="save-button">Save Options</button>
  <div id="status" class="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
